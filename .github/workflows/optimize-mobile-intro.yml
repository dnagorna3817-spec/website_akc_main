name: Optimize mobile intro assets

on:
  push:
    branches:
      - codex/mobile-intro-performance-20261124
    paths:
      - .github/workflows/optimize-mobile-intro.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --user pillow

      - name: Create high-quality, lighter mobile assets
        run: |
          ffmpeg -y -i public/media/mobile.mp4 -an \
            -vf "fps=24,scale=1112:834:flags=lanczos" \
            -loop 1 -c:v libwebp_anim -lossless 0 -q:v 85 \
            -compression_level 6 -preset photo -vsync 0 \
            public/media/akc-intro/mobile-animation.webp

          ffmpeg -y -i public/media/akc-intro/mobile-poster.png \
            -frames:v 1 -c:v libwebp -lossless 0 -q:v 90 \
            public/media/akc-intro/mobile-poster.webp

      - name: Validate dimensions, frames, and file sizes
        run: |
          python - <<'PY'
          from PIL import Image
          import os
          animation = "public/media/akc-intro/mobile-animation.webp"
          poster = "public/media/akc-intro/mobile-poster.webp"
          im = Image.open(animation)
          assert im.size == (1112, 834), im.size
          assert im.n_frames == 97, im.n_frames
          assert im.info.get("loop") == 1, im.info.get("loop")
          for i in range(im.n_frames):
              im.seek(i)
              im.load()
          p = Image.open(poster)
          p.load()
          print("Animation:", im.size, im.n_frames, os.path.getsize(animation), "bytes")
          print("Poster:", p.size, os.path.getsize(poster), "bytes")
          PY

      - name: Commit optimized assets and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/akc-intro/mobile-animation.webp public/media/akc-intro/mobile-poster.webp app/components/LogoIntro.tsx
          git rm .github/workflows/optimize-mobile-intro.yml
          git commit -m "Optimize mobile intro assets for faster loading"
          git push origin "HEAD:${GITHUB_REF_NAME}"
